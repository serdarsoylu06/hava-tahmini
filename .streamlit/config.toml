# "AURA" teması (Stitch referansı): koyu temada AURA Weather (kozmik lacivert zemin, elektrik camgöbeği vurgu, kehribar
# ikincil renk), açık temada Sky-Sync Dawn (şafak zemini, gökyüzü mavisi vurgu). Başlıklar Space Grotesk, metin Inter,
# ölçüm etiketleri ve sayılar Space Mono. Atmosferik arka plan, cam kartlar ve mobil düzen hava/tasarim.py'de.

[client]
# Sağ üstteki menü yalnızca kullanıcıya gereken seçenekleri gösterir; Deploy düğmesi ve geliştirici seçenekleri gizli.
toolbarMode = "minimal"

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'Space Mono':https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.2rem"

[theme.light]
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF3F9"
textColor = "#0F172A"
borderColor = "#DCE4EE"
linkColor = "#0369A1"
blueColor = "#0284C7"
greenColor = "#0F9F6E"
redColor = "#E11D48"
orangeColor = "#D97706"
yellowColor = "#B45309"
violetColor = "#7C3AED"
chartCategoricalColors = ["#0284C7", "#F59E0B", "#FB7185", "#0F9F6E", "#7C3AED", "#0F172A", "#38BDF8"]

[theme.dark]
primaryColor = "#4CD7F6"
backgroundColor = "#0A0E18"
secondaryBackgroundColor = "#171B26"
textColor = "#DFE2F1"
borderColor = "#2A3140"
linkColor = "#4CD7F6"
blueColor = "#4CD7F6"
greenColor = "#4ADE80"
redColor = "#FFB4AB"
orangeColor = "#FFB95F"
yellowColor = "#FDE68A"
violetColor = "#C4B5FD"
chartCategoricalColors = ["#4CD7F6", "#FFB95F", "#FFB4A8", "#4ADE80", "#C4B5FD", "#DFE2F1", "#06B6D4"]

[theme.light.sidebar]
backgroundColor = "#F1F5FB"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark.sidebar]
backgroundColor = "#0D111C"
secondaryBackgroundColor = "#171B26"
