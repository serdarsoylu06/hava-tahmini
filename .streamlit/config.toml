# "Karadeniz" teması: koyu temada arduvaz yeşili zemin ve fıstık yeşili vurgu, açık temada açık yeşil-gri zemin ve koyu
# yaprak yeşili vurgu. Başlıklar Space Grotesk, metin Inter, ölçüm değerleri Space Mono. Manzara, ölçerler, grafik
# kartları ve mobil düzen hava/tasarim.py'de.

[client]
# Sağ üstteki menü yalnızca kullanıcıya gereken seçenekleri gösterir; Deploy düğmesi ve geliştirici seçenekleri gizli.
toolbarMode = "minimal"

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'Space Mono':https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.2rem"

[theme.light]
primaryColor = "#3F7A3A"
backgroundColor = "#E8EEE2"
secondaryBackgroundColor = "#F4F7F0"
textColor = "#1C2829"
borderColor = "#CAD6C4"
linkColor = "#476F17"
blueColor = "#2A6FB0"
greenColor = "#3F7A3A"
redColor = "#B5352B"
orangeColor = "#B2602A"
yellowColor = "#8A6200"
violetColor = "#6B4FA0"
chartCategoricalColors = ["#2E6B3A", "#2A6FB0", "#B2602A", "#8A6200", "#6B4FA0", "#1C2829"]

[theme.dark]
primaryColor = "#C6E066"
backgroundColor = "#1C2829"
secondaryBackgroundColor = "#243537"
textColor = "#E8EFE6"
borderColor = "#38504F"
linkColor = "#C6E066"
blueColor = "#7FB2E5"
greenColor = "#8CBF5A"
redColor = "#FF8F7E"
orangeColor = "#F0A060"
yellowColor = "#F1D24E"
violetColor = "#C4B5FD"
chartCategoricalColors = ["#8CBF5A", "#7FB2E5", "#F0A060", "#F1D24E", "#C4B5FD", "#E8EFE6"]

[theme.light.sidebar]
backgroundColor = "#DFE7D7"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark.sidebar]
backgroundColor = "#182223"
secondaryBackgroundColor = "#243537"
