# "Alet paneli" teması: ölçüm aletini andıran sade yüzeyler, ince çizgiler, tek vurgu rengi (sinyal turuncusu).
# Sayılar IBM Plex Mono, metin IBM Plex Sans. Kart, başlık ve mobil düzen stilleri hava/tasarim.py'de.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 500
linkUnderline = false
paddingTop = "1.2rem"

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#F5F6F7"
secondaryBackgroundColor = "#EEF0F2"
textColor = "#111418"
borderColor = "#D9DDE2"
linkColor = "#C2410C"
blueColor = "#1D4ED8"
greenColor = "#15803D"
redColor = "#B91C1C"
orangeColor = "#C2410C"
yellowColor = "#A16207"
violetColor = "#6D28D9"
chartCategoricalColors = ["#C2410C", "#1D4ED8", "#111418", "#15803D", "#B91C1C", "#0E7490", "#6D28D9"]

[theme.dark]
primaryColor = "#FB923C"
backgroundColor = "#0E1114"
secondaryBackgroundColor = "#171B20"
textColor = "#E8EBEE"
borderColor = "#2A3038"
linkColor = "#FB923C"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FACC15"
violetColor = "#A78BFA"
chartCategoricalColors = ["#FB923C", "#60A5FA", "#E8EBEE", "#4ADE80", "#F87171", "#22D3EE", "#A78BFA"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F7"

[theme.dark.sidebar]
backgroundColor = "#121519"
secondaryBackgroundColor = "#171B20"
